name: brisabase-production

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable digest-pinned image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: brisabase
      POSTGRES_USER: ${POSTGRES_USER:-brisabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_APP_USER: ${DATABASE_APP_USER:?DATABASE_APP_USER is required}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-brisabase-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brisabase_admin} -d brisabase"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to an immutable digest-pinned image}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q '^PONG$'"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [backend]

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to an immutable digest-pinned image}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio-init:
    image: ${MINIO_MC_IMAGE:?Set MINIO_MC_IMAGE to an immutable digest-pinned image}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-brisabase}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET:-brisabase-backups}
    volumes:
      - ./deploy/minio-init.sh:/usr/local/bin/brisabase-minio-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/brisabase-minio-init.sh"]
    networks: [backend]


  # Credential-free production Function execution plane. It is reachable only
  # on the private Compose network and receives no database/Redis/S3/Auth keys.
  functions-executor:
    image: ${FUNCTIONS_IMAGE:?Set FUNCTIONS_IMAGE to an immutable digest-pinned BrisaBase Functions image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
      FUNCTIONS_EXECUTOR_TOKEN: ${FUNCTIONS_EXECUTOR_TOKEN:?FUNCTIONS_EXECUTOR_TOKEN is required}
      FUNCTIONS_API_ORIGIN: http://brisabase:3000
      FUNCTIONS_EXECUTOR_PRIVATE_NETWORK: "true"
      FUNCTIONS_EXECUTOR_MAX_CONCURRENCY: ${FUNCTIONS_EXECUTOR_MAX_CONCURRENCY:-10}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [functions-plane]

  brisabase:
    image: brisabase:${BRISABASE_RELEASE:?BRISABASE_RELEASE is required}
    build:
      context: .
      target: production
      args:
        NODE_BUILD_IMAGE: ${NODE_IMAGE:?NODE_IMAGE is required}
        NODE_RUNTIME_IMAGE: ${NODE_IMAGE:?NODE_IMAGE is required}
        VITE_DATA_SOURCE: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      functions-executor:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BRISABASE_DEPLOYMENT_MODE: self-hosted
      BRISABASE_RELEASE: ${BRISABASE_RELEASE}
      BRISABASE_REGION: ${BRISABASE_REGION:-local-1}
      BRISABASE_PRODUCTION_TIER: ${BRISABASE_PRODUCTION_TIER:-single-host}
      VITE_DATA_SOURCE: api
      SERVE_STATIC: "true"
      PORT: "3000"
      APP_URL: https://${APP_DOMAIN}
      API_URL: https://${APP_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      DATABASE_URL: postgresql://${DATABASE_APP_USER}:${DATABASE_APP_PASSWORD}@postgres:5432/brisabase
      DATABASE_MIGRATION_URL: postgresql://${DATABASE_APP_USER}:${DATABASE_APP_PASSWORD}@postgres:5432/brisabase
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      AUTH_ENCRYPTION_KEY_PREVIOUS: ${AUTH_ENCRYPTION_KEY_PREVIOUS:-}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN}
      API_KEY_HASH_ALGORITHM: sha256
      COOKIE_SECURE: "true"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      STORAGE_ENABLED: "true"
      STORAGE_PROVIDER: minio
      STORAGE_PUBLIC_URL: https://${STORAGE_DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-brisabase}
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_SSL: "false"
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@brisabase.local}
      AUTH_WEBAUTHN_RP_ID: ${AUTH_WEBAUTHN_RP_ID:-}
      AUTH_WEBAUTHN_RP_NAME: ${AUTH_WEBAUTHN_RP_NAME:-BrisaBase}
      AUTH_WEBAUTHN_ORIGINS: ${AUTH_WEBAUTHN_ORIGINS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      AI_PROVIDER_ALLOWED_HOSTS: ${AI_PROVIDER_ALLOWED_HOSTS:-api.openai.com,openrouter.ai,api.groq.com,api.mistral.ai}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
      APP_QUALITY_RETENTION_DAYS: ${APP_QUALITY_RETENTION_DAYS:-90}
      AI_USAGE_RETENTION_DAYS: ${AI_USAGE_RETENTION_DAYS:-90}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_PRO: ${PADDLE_PRICE_PRO:-}
      PADDLE_PRICE_TEAM: ${PADDLE_PRICE_TEAM:-}
      PADDLE_PRICE_ENTERPRISE: ${PADDLE_PRICE_ENTERPRISE:-}
      ENTERPRISE_ENABLED: ${ENTERPRISE_ENABLED:-true}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_PUBLIC_URL: wss://${APP_DOMAIN}/realtime/v1/websocket
      REALTIME_LOGICAL_REPLICATION_ENABLED: ${REALTIME_LOGICAL_REPLICATION_ENABLED:-false}
      FUNCTIONS_ENABLED: "true"
      FUNCTIONS_EXECUTOR_URL: http://functions-executor:3100
      FUNCTIONS_EXECUTOR_TOKEN: ${FUNCTIONS_EXECUTOR_TOKEN}
      FUNCTIONS_RPC_CALLBACK_ORIGIN: http://brisabase:3000
      FUNCTIONS_EXECUTION_TIMEOUT_MS: ${FUNCTIONS_EXECUTION_TIMEOUT_MS:-30000}
      FUNCTIONS_MEMORY_LIMIT_MB: ${FUNCTIONS_MEMORY_LIMIT_MB:-256}
      FUNCTIONS_MAX_CONCURRENT_EXECUTIONS: ${FUNCTIONS_MAX_CONCURRENT_EXECUTIONS:-10}
      BACKUP_ENABLED: "true"
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET:-brisabase-backups}
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 3 * * *}"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RESTORE_CERTIFIED: ${BACKUP_RESTORE_CERTIFIED:-false}
      PITR_ENABLED: ${PITR_ENABLED:-false}
      PITR_PROVIDER: ${PITR_PROVIDER:-neon}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:-}
      NEON_API_KEY: ${NEON_API_KEY:-}
      BRISABASE_OPERATIONS_TOKEN: ${BRISABASE_OPERATIONS_TOKEN}
      BRISABASE_PITR_OPERATOR_TOKEN: ${BRISABASE_PITR_OPERATOR_TOKEN}
      HOSTING_ENABLED: ${HOSTING_ENABLED:-true}
      HOSTING_CUSTOM_DOMAINS_ENABLED: ${HOSTING_CUSTOM_DOMAINS_ENABLED:-true}
      HOSTING_CADDY_ASK_TOKEN: ${HOSTING_CADDY_ASK_TOKEN}
      OBSERVABILITY_ENABLED: "true"
      OBSERVABILITY_LOG_RETENTION_DAYS: ${OBSERVABILITY_LOG_RETENTION_DAYS:-30}
      OBSERVABILITY_METRIC_RETENTION_DAYS: ${OBSERVABILITY_METRIC_RETENTION_DAYS:-30}
      OBSERVABILITY_TRACE_RETENTION_DAYS: ${OBSERVABILITY_TRACE_RETENTION_DAYS:-7}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      INFRASTRUCTURE_PREVIEW_ENABLED: "false"
      ECOSYSTEM_PREVIEW_ENABLED: "false"
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/required').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend, functions-plane]

  reverse-proxy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an immutable digest-pinned image}
    restart: unless-stopped
    depends_on:
      brisabase:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      HOSTING_CADDY_ASK_TOKEN: ${HOSTING_CADDY_ASK_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

networks:
  backend:
    driver: bridge
  functions-plane:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
