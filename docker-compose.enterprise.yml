name: brisabase-enterprise

# Enterprise runs the BrisaBase application plane in Docker while PostgreSQL,
# Redis, S3-compatible storage and horizontally scaled Function execution are
# supplied by the customer's infrastructure. The default bind is loopback so
# an existing corporate ingress/WAF can proxy it.
services:
  # Database migrations run in a short-lived operator plane. The application
  # container never receives DATABASE_MIGRATION_URL, preserving least privilege
  # between schema administration and normal BrisaBase runtime queries.
  brisabase-migrate:
    image: ${BRISABASE_IMAGE:?BRISABASE_IMAGE must be an immutable digest-pinned image}
    restart: "no"
    command: ["node", "server/db/migrate.cjs"]
    environment:
      NODE_ENV: production
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      BRISABASE_ALLOW_DESTRUCTIVE_MIGRATIONS: ${BRISABASE_ALLOW_DESTRUCTIVE_MIGRATIONS:-false}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks: [application]

  brisabase:
    image: ${BRISABASE_IMAGE:?BRISABASE_IMAGE must be an immutable digest-pinned image}
    restart: unless-stopped
    depends_on:
      brisabase-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      BRISABASE_DEPLOYMENT_PROFILE: enterprise
      BRISABASE_DEPLOYMENT_MODE: managed
      BRISABASE_PRODUCTION_TIER: ha
      BRISABASE_RELEASE: ${BRISABASE_RELEASE:?BRISABASE_RELEASE is required}
      BRISABASE_REGION: ${BRISABASE_REGION:-enterprise-1}
      VITE_DATA_SOURCE: api
      SERVE_STATIC: "true"
      PORT: "3000"

      APP_URL: ${APP_URL:?APP_URL is required}
      API_URL: ${API_URL:?API_URL is required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      REALTIME_PUBLIC_URL: ${REALTIME_PUBLIC_URL:?REALTIME_PUBLIC_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-50}

      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REDIS_TLS: "true"
      REDIS_PREFIX: ${REDIS_PREFIX:-brisabase}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY is required}
      AUTH_ENCRYPTION_KEY_PREVIOUS: ${AUTH_ENCRYPTION_KEY_PREVIOUS:-}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?ADMIN_BOOTSTRAP_TOKEN is required}
      API_KEY_HASH_ALGORITHM: sha256
      COOKIE_SECURE: "true"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}

      STORAGE_ENABLED: "true"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-brisabase}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_USE_SSL: "true"

      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}

      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_LOGICAL_REPLICATION_ENABLED: ${REALTIME_LOGICAL_REPLICATION_ENABLED:-false}
      REALTIME_LOGICAL_REPLICATION_SLOT: ${REALTIME_LOGICAL_REPLICATION_SLOT:-}
      REALTIME_LOGICAL_REPLICATION_PUBLICATION: ${REALTIME_LOGICAL_REPLICATION_PUBLICATION:-}
      REALTIME_CDC_ORGANIZATION_ID: ${REALTIME_CDC_ORGANIZATION_ID:-}
      REALTIME_CDC_PROJECT_ID: ${REALTIME_CDC_PROJECT_ID:-}
      REALTIME_CDC_ENVIRONMENT_ID: ${REALTIME_CDC_ENVIRONMENT_ID:-}

      # Managed/HA deployments require a separately deployed HTTPS Functions
      # service. Leave FUNCTIONS_ENABLED=false until that service is available.
      FUNCTIONS_ENABLED: ${FUNCTIONS_ENABLED:-false}
      FUNCTIONS_EXECUTOR_URL: ${FUNCTIONS_EXECUTOR_URL:-}
      FUNCTIONS_EXECUTOR_TOKEN: ${FUNCTIONS_EXECUTOR_TOKEN:-}
      FUNCTIONS_RPC_CALLBACK_ORIGIN: ${FUNCTIONS_RPC_CALLBACK_ORIGIN:-}
      FUNCTIONS_EXECUTION_TIMEOUT_MS: ${FUNCTIONS_EXECUTION_TIMEOUT_MS:-30000}
      FUNCTIONS_MEMORY_LIMIT_MB: ${FUNCTIONS_MEMORY_LIMIT_MB:-256}
      FUNCTIONS_MAX_CONCURRENT_EXECUTIONS: ${FUNCTIONS_MAX_CONCURRENT_EXECUTIONS:-20}

      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET:-brisabase-backups}
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 3 * * *}"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RESTORE_CERTIFIED: ${BACKUP_RESTORE_CERTIFIED:-false}
      PITR_ENABLED: ${PITR_ENABLED:-false}
      PITR_PROVIDER: ${PITR_PROVIDER:-neon}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:-}
      NEON_API_KEY: ${NEON_API_KEY:-}
      BRISABASE_OPERATIONS_TOKEN: ${BRISABASE_OPERATIONS_TOKEN:?BRISABASE_OPERATIONS_TOKEN is required}
      BRISABASE_PITR_OPERATOR_TOKEN: ${BRISABASE_PITR_OPERATOR_TOKEN:?BRISABASE_PITR_OPERATOR_TOKEN is required}

      HOSTING_ENABLED: ${HOSTING_ENABLED:-true}
      HOSTING_CUSTOM_DOMAINS_ENABLED: ${HOSTING_CUSTOM_DOMAINS_ENABLED:-false}
      HOSTING_CADDY_ASK_TOKEN: ${HOSTING_CADDY_ASK_TOKEN:-}
      OBSERVABILITY_ENABLED: "true"
      OBSERVABILITY_LOG_RETENTION_DAYS: ${OBSERVABILITY_LOG_RETENTION_DAYS:-90}
      OBSERVABILITY_METRIC_RETENTION_DAYS: ${OBSERVABILITY_METRIC_RETENTION_DAYS:-90}
      OBSERVABILITY_TRACE_RETENTION_DAYS: ${OBSERVABILITY_TRACE_RETENTION_DAYS:-30}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      INFRASTRUCTURE_PREVIEW_ENABLED: "false"
      ECOSYSTEM_PREVIEW_ENABLED: "false"
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      AUTH_WEBAUTHN_RP_ID: ${AUTH_WEBAUTHN_RP_ID:-}
      AUTH_WEBAUTHN_RP_NAME: ${AUTH_WEBAUTHN_RP_NAME:-BrisaBase}
      AUTH_WEBAUTHN_ORIGINS: ${AUTH_WEBAUTHN_ORIGINS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      AI_PROVIDER_ALLOWED_HOSTS: ${AI_PROVIDER_ALLOWED_HOSTS:-api.openai.com,openrouter.ai,api.groq.com,api.mistral.ai}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
      APP_QUALITY_RETENTION_DAYS: ${APP_QUALITY_RETENTION_DAYS:-90}
      AI_USAGE_RETENTION_DAYS: ${AI_USAGE_RETENTION_DAYS:-90}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      ENTERPRISE_ENABLED: ${ENTERPRISE_ENABLED:-true}
    ports:
      - "${BRISABASE_BIND_ADDRESS:-127.0.0.1}:${BRISABASE_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/required').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [application]

  # Optional edge profile for teams that want the bundled Caddy proxy. Large
  # enterprises can omit it and use their existing WAF/load balancer instead.
  reverse-proxy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required when the edge profile is enabled}
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      brisabase:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required for the edge profile}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?STORAGE_DOMAIN is required for the edge profile}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for the edge profile}
      HOSTING_CADDY_ASK_TOKEN: ${HOSTING_CADDY_ASK_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [application]

networks:
  application:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
