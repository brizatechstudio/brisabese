# Real local integration stack. No host filesystem, in-memory database, Redis
# fixture or local Storage adapter participates in this compose project.
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: brisabase
      POSTGRES_USER: brisabase
      # Kept compatible with the existing local compose volume. Development only.
      POSTGRES_PASSWORD: brisabase
    ports:
      - "127.0.0.1:${BRISABASE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brisabase -d brisabase"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${BRISABASE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brisabase
      MINIO_ROOT_PASSWORD: brisabase-local-minio-development-only
    ports:
      - "127.0.0.1:${BRISABASE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${BRISABASE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 brisabase brisabase-local-minio-development-only &&
      mc mb --ignore-existing local/brisabase &&
      mc mb --ignore-existing local/brisabase-backups"

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "127.0.0.1:${BRISABASE_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${BRISABASE_MAILPIT_PORT:-8025}:8025"

  # Real isolated execution plane. It receives no PostgreSQL, Redis, S3, JWT,
  # SMTP, bootstrap, or encryption credentials. The only shared secret is the
  # executor authentication token used by the BrisaBase API.
  functions-executor:
    build:
      context: .
      dockerfile: Dockerfile.functions
    image: brisabase-functions-local:dev
    environment:
      NODE_ENV: development
      PORT: "3100"
      FUNCTIONS_EXECUTOR_TOKEN: brisabase-local-functions-executor-token-with-more-than-thirty-two-bytes
      FUNCTIONS_API_ORIGIN: http://brisabase:3000
      FUNCTIONS_EXECUTOR_MAX_CONCURRENCY: "10"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  brisabase-migrate:
    build:
      context: .
      target: integration
    image: brisabase-local:dev
    restart: "no"
    command: ["node", "server/db/migrate.cjs"]
    environment: &brisabase-env
      NODE_ENV: development
      BRISABASE_RUNTIME_MODE: integration
      # Release-gate override only. Production rejects this variable.
      BRISABASE_TEST_RATE_LIMIT: "10000"
      VITE_DATA_SOURCE: api
      SERVE_STATIC: "true"
      PORT: 3000
      DATABASE_URL: postgresql://brisabase:brisabase@postgres:5432/brisabase
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: brisabase
      PGUSER: brisabase
      PGPASSWORD: brisabase
      REDIS_URL: redis://redis:6379
      JWT_SECRET: brisabase-local-jwt-secret-with-at-least-thirty-two-bytes
      JWT_SECRET_PREVIOUS: ""
      AUTH_ENCRYPTION_KEY: brisabase-local-auth-encryption-with-at-least-thirty-two-bytes
      AUTH_ENCRYPTION_KEY_PREVIOUS: ""
      BACKUP_ENCRYPTION_KEY: brisabase-local-backup-encryption-with-at-least-thirty-two-bytes
      ADMIN_BOOTSTRAP_TOKEN: local-bootstrap-token-for-isolated-e2e-only-2026
      API_KEY_HASH_ALGORITHM: sha256
      CORS_ALLOWED_ORIGINS: ${BRISABASE_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: brisabase
      S3_SECRET_KEY: brisabase-local-minio-development-only
      S3_BUCKET: brisabase
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@brisabase.local
      AUTH_WEBAUTHN_RP_ID: localhost
      AUTH_WEBAUTHN_RP_NAME: BrisaBase Local
      AUTH_WEBAUTHN_ORIGINS: ${BRISABASE_PUBLIC_URL:-http://localhost:3000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      AI_PROVIDER_ALLOWED_HOSTS: ${AI_PROVIDER_ALLOWED_HOSTS:-api.openai.com,openrouter.ai,api.groq.com,api.mistral.ai}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
      APP_QUALITY_RETENTION_DAYS: ${APP_QUALITY_RETENTION_DAYS:-90}
      AI_USAGE_RETENTION_DAYS: ${AI_USAGE_RETENTION_DAYS:-90}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      ENTERPRISE_ENABLED: ${ENTERPRISE_ENABLED:-true}
      APP_URL: ${BRISABASE_PUBLIC_URL:-http://localhost:3000}
      API_URL: ${BRISABASE_PUBLIC_URL:-http://localhost:3000}
      STORAGE_PUBLIC_URL: ${BRISABASE_PUBLIC_URL:-http://localhost:3000}
      REALTIME_PUBLIC_URL: ${BRISABASE_REALTIME_PUBLIC_URL:-ws://localhost:3000/realtime/v1/websocket}
      REALTIME_ENABLED: "true"
      REALTIME_LOGICAL_REPLICATION_ENABLED: "false"
      FUNCTIONS_ENABLED: "true"
      INFRASTRUCTURE_PREVIEW_ENABLED: "true"
      ECOSYSTEM_PREVIEW_ENABLED: "true"
      OBSERVABILITY_ENABLED: "true"
      OBSERVABILITY_LOG_RETENTION_DAYS: "30"
      OBSERVABILITY_METRIC_RETENTION_DAYS: "30"
      OBSERVABILITY_TRACE_RETENTION_DAYS: "7"
      LOG_FORMAT: json
      BACKUP_ENABLED: "true"
      BACKUP_RESTORE_CERTIFIED: ${BRISABASE_BACKUP_RESTORE_CERTIFIED:-false}
      BACKUP_STORAGE_BUCKET: brisabase-backups
    depends_on:
      postgres:
        condition: service_healthy

  # The development seed is idempotent and contains no administrator password.
  # It creates only a local project scope and the development-only service key
  # used by server/tests/docker.integration.test.ts.
  brisabase-seed:
    build:
      context: .
      target: integration
    image: brisabase-local:dev
    restart: "no"
    command: ["node", "server/db/seed.cjs"]
    environment: *brisabase-env
    depends_on:
      brisabase-migrate:
        condition: service_completed_successfully

  brisabase:
    build:
      context: .
      target: integration
    image: brisabase-local:dev
    environment:
      <<: *brisabase-env
      FUNCTIONS_EXECUTOR_URL: http://functions-executor:3100
      FUNCTIONS_EXECUTOR_TOKEN: brisabase-local-functions-executor-token-with-more-than-thirty-two-bytes
      FUNCTIONS_RPC_CALLBACK_ORIGIN: http://brisabase:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      functions-executor:
        condition: service_healthy
      brisabase-migrate:
        condition: service_completed_successfully
      brisabase-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BRISABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/required').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
